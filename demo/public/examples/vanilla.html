<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TinyPose Vanilla 示例</title><h1>TinyPose Vanilla 示例</h1><button id="run">运行单人示例</button><pre id="result" role="status">尚未运行</pre><script type="module">
import {createTinyPose} from '../sdk/index.js';
const button=document.querySelector('#run'), output=document.querySelector('#result');
button.onclick=async()=>{
  button.disabled=true;
  const model={id:'tinypose-enhance-256x192',version:'0.1.0-alpha.0',url:new URL('../models/tinypose-256x192-fp32.onnx',location.href).href,bytes:5685847,sha256:'7614d17acbe957200a8505e11a4fb8445103f9e44a7087115d8a1ea85f88b1b9'};
  const pose=createTinyPose({model,backend:'wasm',executionMode:'main',runtimeBaseUrl:new URL('../sdk/',location.href).href});
  try{await pose.load();const image=await(await fetch('./person.jpg')).blob();const result=await pose.run({image});output.textContent=JSON.stringify(result,null,2);}catch(error){output.textContent=String(error);}finally{await pose.dispose();button.disabled=false;}
};
</script></html>
