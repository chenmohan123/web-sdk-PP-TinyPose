<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TinyPose Vanilla 示例</title><h1>TinyPose Vanilla 示例</h1><button id="run">运行单人示例</button><pre id="result" role="status">尚未运行</pre><script type="module">
import {createTinyPose} from '../sdk/index.js';
const button=document.querySelector('#run'), output=document.querySelector('#result');
button.onclick=async()=>{
  button.disabled=true;
  let pose;
  try {
    const response=await fetch('../models/model.json');
    if(!response.ok) throw new Error(`模型 metadata HTTP ${response.status}`);
    const metadata=await response.json();
    const source=metadata.sources.find(source=>source.kind===metadata.defaultSource);
    const model={...metadata,url:source.downloadUrl};
    pose=createTinyPose({model,backend:'wasm',executionMode:'main',runtimeBaseUrl:new URL('../sdk/',location.href).href});
    await pose.load();
    const image=await(await fetch('./person.jpg')).blob();
    const result=await pose.run({image});
    output.textContent=JSON.stringify(result,null,2);
  } catch(error) {output.textContent=String(error);}
  finally {await pose?.dispose();button.disabled=false;}
};
</script></html>
